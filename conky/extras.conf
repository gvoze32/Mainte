-- Template rendered by `mainte run --extensions` into the runtime directory.
-- CPU, gateway, and DNS rows always show; the others need their provider.
conky.config = {
    background = false,
    font = 'FiraCode Nerd Font Mono:pixelsize=9',
    use_xft = true,
    xftalpha = 1.0,
    update_interval = 5,
    total_run_times = 0,
    own_window = true,
    own_window_transparent = true,
    own_window_type = 'dock',
    own_window_class = 'Conky',
    own_window_title = 'mainte-extras',
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_colour = '#000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    stippled_borders = 0,
    border_width = 0,
    default_color = '#{{color}}',
    default_shade_color = '#{{color}}',
    default_outline_color = '#{{color}}',
    alignment = 'bottom_right',
    gap_x = {{art_gap_x}},
    gap_y = 32,
    no_buffers = true,
    use_spacer = 'none',
    minimum_width = 640,
    maximum_width = 1024,
    uppercase = true,
    override_utf8_locale = true,
    default_bar_width = 110,
    default_bar_height = 5,
};

conky.text = [[
${alignr}┌──────── Extensions ────────┐
${alignr}< ${freq_g} GHz | ${processes} procs | ${running_processes} running > CPU ────────┤
${alignr}< ${execi 60 sh providers/features.sh gateway} > Gateway ────┤
${alignr}< ${execi 300 sh providers/features.sh dns {{iface}}} > DNS ────────┤
${if_match ${execi 30 sh providers/features.sh available traffic} == 1}${alignr}< ${execi 60 sh providers/features.sh traffic {{iface}}} > Traffic ────┤
${endif}${if_match ${execi 30 sh providers/features.sh available weather} == 1}${alignr}< ${texeci 1800 sh providers/features.sh weather} > Weather ────┤
${endif}${if_match ${execi 30 sh providers/features.sh available media} == 1}${alignr}< ${execi 5 sh providers/features.sh media} > Media ──────┤
${alignr}< ${execi 5 sh providers/features.sh media-time} ${execibar 5 sh providers/features.sh media-percent} > Playback ───┤
${endif}${if_match ${execi 30 sh providers/features.sh available bluetooth} == 1}${alignr}< ${execi 30 sh providers/features.sh bluetooth} > Bluetooth ──┤
${endif}${if_match ${execi 30 sh providers/features.sh available usb} == 1}${alignr}< ${execi 30 sh providers/features.sh usb} > USB ────────┤
${endif}${if_match ${execi 30 sh providers/features.sh available android} == 1}${alignr}< ${execi 30 sh providers/features.sh android} > Android ────┤
${endif}${if_match ${execi 30 sh providers/features.sh available gpu} == 1}${alignr}< ${execi 10 sh providers/features.sh gpu} > GPU ────────┤
${endif}${alignr}└────────────────────────────┘
]];
