-- Template rendered by `mainte run` into the runtime directory.
-- Section voffsets combine the spacing of the original layout with the
-- per-section adjustments saved by `mainte layout`.
conky.config = {
    background = false,
    font = 'FiraCode Nerd Font Mono:pixelsize=9',
    use_xft = true,
    xftalpha = 1.0,
    update_interval = 2,
    total_run_times = 0,
    own_window = true,
    own_window_transparent = true,
    own_window_type = 'dock',
    own_window_class = 'Conky',
    own_window_title = 'mainte-text',
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_colour = '#000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    stippled_borders = 0,
    border_width = 0,
    border_inner_margin = 0,
    border_outer_margin = 0,
    default_color = '#{{color}}',
    default_shade_color = '#{{color}}',
    default_outline_color = '#{{color}}',
    alignment = 'top_right',
    gap_x = {{text_gap_x}},
    gap_y = {{text_gap_y}},
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    use_spacer = 'none',
    minimum_width = 1024,
    maximum_width = 1024,
    minimum_height = 640,
    uppercase = true,
    override_utf8_locale = true,
};

conky.text = [[
${voffset {{offset identity 0}}}${alignr}${offset 250}--------------------------------
${alignr}${offset 0}┌──────── ${nodename} ─────────────
${alignr}${offset -110}${execi 3600 id -un} ──────┐
${alignr}${offset -110}< ${execi 3600 sh providers/sysinfo.sh distro} > Distro ─┤
${alignr}${offset -110}< ${kernel} > Kernel ─┤
${alignr}${offset -110}< ${uptime_short} > Uptime ─┘
${voffset {{offset graphics 0}}}
${alignr}${offset -30}┌──────────
${alignr}${offset -80}│
${alignr}${offset -80}< ${execi 3600 sh providers/sysinfo.sh gpu} > GPU ────────────┘
${alignr}${offset -150}< ${execi 60 sh providers/sysinfo.sh resolution} > Res
${voffset {{offset locale 10}}}
${alignr}${offset -45}< ${execi 3600 sh providers/sysinfo.sh locale} > Locale ────────────────┐
${alignr}${offset -45}│
${alignr}${offset -45}│
${voffset {{offset performance -10}}}
${alignr}${offset -75}< ${execi 10 sh providers/sysinfo.sh fan} > Fan Speed ──────────┐
${alignr}${offset -75}│
${alignr}${offset -75}│
${alignr}${offset -75}┌────── Temperatures ───────────────┤
${alignr}${offset -165}├─ Temp 1 < ${execi 10 sh providers/sysinfo.sh temperature 1} >${alignr}${offset -75}│
${alignr}${offset -165}└─ Temp 2 < ${execi 10 sh providers/sysinfo.sh temperature 2} >${alignr}${offset -75}│
${alignr}${offset -75}│
${alignr}${offset -75}│
${alignr}${offset -75}┌───── < ${execi 3600 sh providers/sysinfo.sh cpu} > ──────────┤
${alignr}${offset -325}│${offset 250}│
${alignr}${offset -260}└─── Processes${offset 185}│
${alignr}${offset -175}< ${top name 1}  ${top cpu 1} >${offset 100}│
${alignr}${offset -175}< ${top name 2}  ${top cpu 2} >${offset 100}│
${alignr}${offset -175}< ${top name 3}  ${top cpu 3} >${offset 100}│
${alignr}${offset -175}< ${top name 4}  ${top cpu 4} >${offset 100}│
${alignr}${offset -75}│
${voffset {{offset memory 15}}}
${alignr}${offset -75}< $memperc% | $mem/$memmax ${membar 5,50} > RAM ──────────┐
${alignr}${offset -75}│
${voffset {{offset network 10}}}
${alignr}${offset -75}${addr {{iface}}} : ${execi 30 sh providers/sysinfo.sh network {{iface}}} ────────────┐
${alignr}${offset -115}UP < ${upspeedgraph {{iface}} 15,130 {{color}} {{color}}} >${voffset -15}${offset 40}│
${alignr}${offset -110}${voffset 10}DOWN < ${downspeedgraph {{iface}} 15,130 {{color}} {{color}}} >${voffset -25}${offset 40}└─
${voffset {{offset battery 20}}}
${alignr}${offset -75}${if_existing /sys/class/power_supply/{{battery}}/capacity}${battery_percent {{battery}}}${else}N/A${endif} : Battery ───────────────────┐
${alignr}${offset -95}${if_existing /sys/class/power_supply/{{battery}}/capacity}< ${battery_status {{battery}}} | ${battery_percent {{battery}}}% > {{battery_label}} < ${battery_bar 5,110 {{battery}}} >${else}< No battery >${endif}
${voffset {{offset storage 25}}}
${alignr}${offset -60}Hard Drive ─────────────────┐
${alignr}${offset -70}< ${fs_used_perc /}% > Root < ${fs_bar 5,120 /} >${offset 10}│
${alignr}${offset -70}< ${fs_used_perc /home}% > Home < ${fs_bar 5,120 /home} >${offset 10}│
${alignr}${offset -10}<  ${swapperc}% > Swap < ${swapbar 5,120} >${offset 10}└────────────
]];
